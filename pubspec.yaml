name: vanicalc
description: "VaniCalc – a premium smart voice calculator with 10 Indian languages, offline number-to-words and speech."
publish_to: 'none'
version: 1.1.0+2
homepage: https://github.com/sampath365/vanicalc
repository: https://github.com/sampath365/vanicalc
issue_tracker: https://github.com/sampath365/vanicalc/issues

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_ui: ^1.1.7
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  intl: ^0.20.3
  share_plus: ^13.3.1
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FF7A18"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 23

flutter_native_splash:
  color: "#FFF7F1"
  color_dark: "#080D1A"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#FFF7F1"
    color_dark: "#080D1A"
    image: assets/icon/splash_logo.png
    icon_background_color: "#FFF7F1"
    icon_background_color_dark: "#080D1A"
  ios: true
  android: true
  web: false
  fullscreen: false
